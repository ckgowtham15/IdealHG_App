services:
  - type: web
    name: ideal-hg-sop
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - { key: DATA_DIR, value: /data }
      - { key: ADMIN_USER, value: admin }
      - { key: ADMIN_PASSWORD, sync: false }
    disk: { name: sop-data, mountPath: /data, sizeGB: 1 }
